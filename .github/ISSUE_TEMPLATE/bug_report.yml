name: Bug report
description: Report a defect in YourDay
title: '[Bug] '
labels: ['bug', 'needs triage']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report. Please fill out the fields below so we can reproduce and fix the issue quickly.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
      placeholder: When I dragged a guest from the unassigned list to a full table...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to Room Layout
        2. Add 8 guests to a 6-chair table
        3. Observe the capacity warning
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser + version
      placeholder: Chrome 124, Firefox 125, Safari 17.4
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11, macOS 14.4, Ubuntu 24.04
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: App version or commit SHA
      placeholder: v1.3.0 or 7079cfc

  - type: textarea
    id: config
    attributes:
      label: Project export (optional)
      description: |
        If the bug depends on data state, paste the JSON from Settings → Download Project. Strip any sensitive guest info first.
      render: json

  - type: textarea
    id: extra
    attributes:
      label: Anything else?
