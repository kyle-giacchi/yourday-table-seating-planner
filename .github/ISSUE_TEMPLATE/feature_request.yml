name: Feature request
description: Suggest a new feature or improvement
title: '[Feature] '
labels: ['enhancement', 'needs triage']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion! Please describe what you want and why.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: What can't you do today, or what's painful about doing it?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How do you see this working from a user's perspective?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other ways to solve the same problem that you considered or rejected.

  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Mockups, links to similar features in other tools, etc.
